name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      - name: Check the tag matches the app version
        run: |
          version=$(go run ./scripts/version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match mygo.json version $version" >&2
            exit 1
          fi

      # Without a Developer ID the app is signed ad hoc: users open it once via
      # right-click → Open. Set MACOS_SIGNING_IDENTITY (and a notarytool
      # profile) in the repository secrets to sign and notarize.
      - name: Build and upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform darwin/universal -upload
