name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        env:
          CGO_ENABLED: "0"
        run: go vet ./... && go tool mygo vet .

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      - name: Check message catalogs
        run: go tool mygo i18n check

      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      # 竞态检测需要 cgo；界面里依赖耗时的两个测试在 -race 下会自动跳过
      - name: Race
        env:
          CGO_ENABLED: "1"
        run: go test -race ./internal/...

      - name: Build the app
        run: go tool mygo build -skip-dmg

  # 用真实的 MySQL / PostgreSQL 实例跑元数据读取的集成测试（服务容器只在 Linux 上可用）
  integration:
    name: Integration (MySQL / MariaDB / PostgreSQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppw"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: pw
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: minidb_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Integration tests
        env:
          CGO_ENABLED: "0"
          INTEGRATION_TEST: "1"
          MINIDB_IT_MYSQL_HOST: 127.0.0.1
          MINIDB_IT_MYSQL_USER: root
          MINIDB_IT_MYSQL_PASSWORD: pw
          MINIDB_IT_MARIADB_HOST: 127.0.0.1
          MINIDB_IT_MARIADB_PORT: "3307"
          MINIDB_IT_MARIADB_USER: root
          MINIDB_IT_MARIADB_PASSWORD: pw
          MINIDB_IT_PG_HOST: 127.0.0.1
          MINIDB_IT_PG_USER: postgres
          MINIDB_IT_PG_PASSWORD: pw
        run: go test ./internal/database/ -run TestIntegrationServices -count=1 -v
