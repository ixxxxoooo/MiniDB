name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        env:
          CGO_ENABLED: "0"
        run: go vet ./... && go tool mygo vet .

      - name: Check message catalogs
        run: go tool mygo i18n check

      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      - name: Build the app
        run: go tool mygo build -skip-dmg
